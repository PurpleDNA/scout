<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout</title>
<script>
// Runs before first paint so the page never flashes the wrong theme. A saved choice wins; otherwise follow the system.
(()=>{let saved=null;try{saved=localStorage.getItem('scout-theme')}catch{}
document.documentElement.dataset.theme=saved==='dark'||saved==='light'?saved:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'})()
</script>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--panel:#fff;--panel-2:#eceef1;--ink:#16181d;--muted:#5b616e;--line:#dfe2e7;--accent:#1f4fd8;--on-accent:#fff;--accent-soft:#e6ecfd;--warn:#8a5300;--warn-soft:#fbf0dc;--bad:#b3261e;--shadow:0 1px 2px rgb(22 24 29/.06)}
:root[data-theme=dark]{color-scheme:dark;--bg:#101216;--panel:#181b20;--panel-2:#22262c;--ink:#eceef1;--muted:#a0a6b1;--line:#2c3037;--accent:#8fadff;--on-accent:#0d1530;--accent-soft:#1d2740;--warn:#eab765;--warn-soft:#33280f;--bad:#f2968f;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:1.2em;height:1.2em;flex:none;display:block}
header{background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--panel-2);border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:6px;padding:5px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg.theme button{display:grid;place-items:center;padding:5px 8px}
.seg b{font-weight:500;font-variant-numeric:tabular-nums;margin-left:5px;color:var(--muted)}
.search{position:relative;flex:1;min-width:180px;max-width:420px;margin-left:auto}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:6px 10px 6px 32px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.filters{display:flex;gap:14px;padding:0 16px 10px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.field select{font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;padding-bottom:5px}
.link{background:none;border:0;padding:0 0 5px;color:var(--accent);font-size:13px;text-decoration:underline}
main{flex:1;display:grid;grid-template-columns:minmax(360px,460px) 1fr;min-height:0}
#list{overflow-y:auto;margin:0;padding:0;list-style:none;border-right:1px solid var(--line);background:var(--panel)}
.row{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--line);position:relative}
.row:hover{background:var(--bg)}
.row.on{background:var(--accent-soft)}
.pick{display:grid;grid-template-columns:34px 1fr;gap:10px;text-align:left;background:none;border:0;padding:12px 0 12px 14px;min-width:0;color:inherit}
.score{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.score.strong{color:var(--accent)}.score.fair,.score.weak{color:var(--muted);font-weight:500}
.pick h2{font-size:14px;font-weight:600;margin:0;line-height:1.3;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;padding:0 7px;border-radius:5px;background:var(--panel-2);line-height:20px;white-space:nowrap}
.chip.good{background:var(--accent-soft);color:var(--accent)}.row.on .chip.good{background:var(--panel)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:none;box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}
.stage{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip.miss{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.quick{display:flex;flex-direction:column;gap:4px;padding:10px 10px 10px 6px}
.icon{width:34px;height:34px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);transition:transform .1s}
.icon:hover{color:var(--ink);border-color:var(--muted)}
.icon:active,.btn:active{transform:scale(.96)}
.icon.like[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#detail{overflow-y:auto;min-height:0}
.sticky{position:sticky;top:0;background:var(--bg);padding:18px 28px 12px;border-bottom:1px solid var(--line)}
.sticky h2{font-size:21px;line-height:1.25;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;font-weight:550;text-decoration:none;color:var(--ink);white-space:nowrap;transition:transform .1s}
.btn:hover{border-color:var(--muted)}
.btn.like{border-color:var(--accent);color:var(--accent)}
.btn.like[aria-pressed=true],.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[aria-pressed=true]:not(.like){background:var(--panel-2);border-color:var(--muted)}
.btn.primary{margin-left:auto}
.body{padding:16px 28px 48px;max-width:820px}
.note{display:flex;gap:8px;padding:9px 12px;border-radius:8px;background:var(--accent-soft);margin-bottom:8px;font-size:13px}
.note svg{color:var(--accent);margin-top:2px}
.note.warn{background:var(--warn-soft)}.note.warn svg{color:var(--warn)}
section{margin-top:22px}
h3{font-size:13px;margin:0 0 8px;font-weight:650}
.why{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.big{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.big small{display:block;font-size:12px;font-weight:550;color:var(--muted);margin-top:5px;white-space:nowrap}
.adj{display:block;font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap}
.bars{display:grid;grid-template-columns:84px 1fr 26px;gap:3px 10px;align-items:center;font-size:13px}
.meter{height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.desc{white-space:pre-line;overflow-wrap:anywhere;max-width:70ch;line-height:1.6}
.origin{margin-top:18px}
.origin a{color:var(--accent)}
.empty{padding:48px 24px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:12px}
.skel{height:84px;border-bottom:1px solid var(--line);padding:14px}
.skel i{display:block;height:10px;background:var(--panel-2);border-radius:4px;margin-bottom:9px}.skel i:nth-child(1){width:70%}.skel i:nth-child(2){width:40%}
@media (prefers-reduced-motion:no-preference){.skel i{animation:fade 1.1s ease-in-out infinite alternate}@keyframes fade{to{opacity:.45}}}
#toast{position:fixed;left:50%;bottom:44px;z-index:2;width:min(480px,calc(100vw - 16px));transform:translateX(-50%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -12px rgb(22 24 29/.28),0 2px 6px rgb(22 24 29/.08);overflow:hidden;display:none}
:root[data-theme=dark] #toast{box-shadow:0 18px 40px -8px rgb(0 0 0/.6),0 0 0 1px rgb(255 255 255/.03)}
#toast.show{display:block}
@media (prefers-reduced-motion:no-preference){#toast.show{animation:rise .2s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{opacity:0;transform:translate(-50%,10px) scale(.98)}}}
.t-head{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px}
.t-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--panel-2);color:var(--muted)}
.t-icon.good{background:var(--accent-soft);color:var(--accent)}
.t-text{flex:1;min-width:0;font-size:13px;line-height:1.4}
.t-text strong{display:block;font-weight:650;font-size:14px}
.t-text span{color:var(--muted)}
.t-undo{background:none;border:0;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;color:var(--accent);flex:none}
.t-undo:hover{background:var(--accent-soft)}
.t-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 14px}
.t-choice:last-child:nth-child(odd){grid-column:1/-1}
.t-choice{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;transition:border-color .12s,background .12s,transform .1s}
.t-choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.t-choice:active{transform:scale(.98)}
.t-choice>svg{grid-row:span 2;color:var(--accent);width:20px;height:20px}
.t-choice b{font-weight:600;font-size:13px}
.t-choice small{grid-column:2;color:var(--muted);font-size:12px;line-height:1.3}
.t-choice kbd{grid-row:1;grid-column:3;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;min-width:20px;text-align:center;line-height:18px}
.t-clock{height:3px;background:var(--panel-2)}.t-clock i{display:block;height:100%;background:var(--accent);transform-origin:left;opacity:.7}
@keyframes clock{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (max-width:820px){.t-choice kbd{display:none}#toast{bottom:12px}}
@media (max-width:340px){.t-choices{grid-template-columns:1fr}}
footer{padding:5px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;background:var(--panel)}
kbd{font:inherit;font-weight:600;color:var(--ink)}
.back,.toggle{display:none}
@media (max-width:820px){
 main{display:block;overflow:hidden;position:relative}
 #list{height:100%;border-right:0}
 #detail{position:absolute;inset:0;background:var(--bg);display:none}
 body.reading #detail{display:block}
 .back{display:inline-flex;margin-bottom:10px}
 .sticky{padding:12px 16px}.body{padding:14px 16px 40px}
 .btn.primary{margin-left:0}
 .hints{display:none}.search{max-width:none;order:3;flex-basis:100%}
 .filters{gap:10px;display:none}.filters.open{display:flex}
 .toggle{display:inline-flex}
 body.reading header{display:none}
 .seg{overflow-x:auto;max-width:100%}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Scout</h1>
    <div class="seg" id="lanes" role="group" aria-label="Where"></div>
    <div class="seg" id="views" role="group" aria-label="Which jobs"></div>
    <button class="btn toggle" id="toggle" aria-expanded="false" aria-controls="filters">Filters</button>
    <label class="search"><span id="searchIcon"></span><input type="search" id="q" placeholder="Search title, company or text" aria-label="Search"></label>
    <div class="seg theme" id="theme" role="group" aria-label="Theme"></div>
  </div>
  <div class="filters" id="filters">
    <label class="field">Setup<select id="work"><option value="">Any</option><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">On-site or not stated</option></select></label>
    <label class="field">Job type<select id="employment"><option value="">Any</option><option value="full_time">Full-time</option><option value="part_time">Part-time</option><option value="contract">Contract</option><option value="internship">Internship or trainee</option></select></label>
    <label class="field">Posted<select id="posted"><option value="">Any time</option><option value="1">Last 24 hours</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></label>
    <label class="field">Match<select id="min"><option value="0">Any score</option><option value="45">45 and up</option><option value="60" selected>60 and up</option><option value="75">75 and up</option></select></label>
    <label class="field">Sort<select id="sort"><option value="best">Best match</option><option value="newest">Newest</option></select></label>
    <label class="check"><input type="checkbox" id="unv">Include unverified remote</label>
    <button class="link" id="reset" hidden>Clear filters</button>
  </div>
</header>
<main>
  <ul id="list" aria-label="Recommended jobs"></ul>
  <div id="detail"></div>
</main>
<div id="toast" role="status"></div>
<footer><span id="line" aria-live="polite"></span><span class="hints"><kbd>j</kbd> <kbd>k</kbd> move, <kbd>l</kbd> like, <kbd>x</kbd> not for me, <kbd>a</kbd> applied, <kbd>o</kbd> open</span></footer>

  else if(next==='dislike')toast('What was off? Your answer decides what moves down.',undo,{title:'Hidden from your list',icon:'hide',
    choices:Object.entries(REASON).map(([v,n])=>[n,REASON_HINT[v][1],REASON_HINT[v][0],()=>setReason(j,v)])});
  else if(next==='applied')toast(`${j.title} at ${j.company}`,undo,{title:'Marked as applied',icon:'sentFill',tone:'good'});
  else toast('Ranking updated.',undo,{title:before==='like'?'Unliked':'Removed',icon:'check'});
}
// Hands the posting's own link to the system share sheet where there is one, and copies it otherwise.
async function share(j,url){
  if(navigator.share){try{await navigator.share({title:`${j.title} at ${j.company}`,url});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast(url,null,{title:'Link copied',icon:'check',tone:'good'})}catch{toast(url,null,{title:'Copy this link',icon:'share',ms:10000})}
}
function renderDetail(){const j=current(),d=$('detail');if(!j){d.replaceChildren();document.body.classList.remove('reading');return}const url=safeUrl(j.url);
  const notes=[];
  if(j.closed||j.stale)notes.push(h('div',{class:'note warn'},svg('warn'),h('div',{},h('strong',{},j.closed?'Listing closed. ':'Over 60 days old. '),j.closed?'Its board has stopped listing it. It stays here because you marked it.':'It may have been filled. It stays here because you marked it.')));
  notes.push(h('div',{class:'note'+(j.confidence==='high'?'':' warn')},svg(j.confidence==='high'?'ok':'warn'),h('div',{},h('strong',{},j.confidence==='high'?'Open to you. ':j.confidence==='medium'?'Probably open to you. ':'Check this first. '),j.evidence)));
  if(j.flags.includes('us_hours'))notes.push(h('div',{class:'note warn'},svg('warn'),h('div',{},h('strong',{},'US hours. '),'The posting mentions US time zones, which may mean evening work from Lagos.')));
  if(j.years_required&&j.years_required>3)notes.push(h('div',{class:'note warn'},svg('warn'),h('div',{},h('strong',{},'Experience. '),`Asks for ${j.years_required}+ years.`)));
  const adj=j.feedback_points?h('span',{class:'adj'},`${j.feedback_points>0?'+':''}${Math.round(j.feedback_points)} from your feedback`):null;
  d.replaceChildren(
    h('div',{class:'sticky'},
      h('button',{class:'btn back',onclick(){document.body.classList.remove('reading')}},svg('back'),'Back to list'),
      h('h2',{},j.title),
      h('div',{class:'sub'},[j.company,j.location,TYPE[j.employment],j.salary,ago(j.posted_at)].filter(Boolean).join(', ')),
      h('div',{class:'actions'},
        h('button',{class:'btn like','aria-pressed':String(j.state==='like'),onclick(){react(j,'like')}},svg(j.state==='like'?'upFill':'up'),j.state==='like'?'Liked':'Like'),
        h('button',{class:'btn','aria-pressed':String(j.state==='dislike'),onclick(){react(j,'dislike')}},svg(j.state==='dislike'?'downFill':'down'),'Not for me'),
        h('button',{class:'btn','aria-pressed':String(j.state==='applied'),onclick(){react(j,'applied')}},svg(j.state==='applied'?'sentFill':'sent'),'Applied'),
        url&&h('button',{class:'btn',type:'button',onclick(){share(j,url)}},svg('share'),'Share'),
        url&&h('a',{class:'btn primary',href:url,target:'_blank',rel:'noopener'},'Open posting',svg('out'))),
      j.state==='applied'&&h('div',{class:'stage'},h('span',{},`Applied ${ago(j.marked_at)}. Status:`),
        h('div',{class:'seg',role:'group','aria-label':'Application status'},Object.entries(STAGE).map(([v,n])=>h('button',{type:'button','aria-pressed':String((j.stage||'')===v),onclick(){setStage(j,v||null)}},n))),
        j.stage&&j.stage_at&&h('span',{},`since ${ago(j.stage_at)}`)),
      j.state==='dislike'&&h('div',{class:'stage'},h('span',{},'Why not:'),
        h('div',{class:'seg',role:'group','aria-label':'Why this job was not for you'},[['','No reason'],...Object.entries(REASON)].map(([v,n])=>h('button',{type:'button','aria-pressed':String((j.reason||'')===v),onclick(){if((j.reason||'')!==v)setReason(j,v||null)}},n))))),
    h('div',{class:'body'},notes,
      h('section',{},h('h3',{},'Why this score'),h('div',{class:'why'},
        h('div',{class:'big'},String(j.score),h('small',{},j.label),adj),
        h('div',{class:'bars'},Object.entries(PARTS).flatMap(([k,n])=>[h('span',{},n),h('div',{class:'meter'},h('i',{style:`width:${Math.round(j.parts[k]*100)}%`})),h('span',{class:'num'},String(Math.round(j.parts[k]*100)))])))),
      (j.matched_skills.length||j.missing_skills.length)?h('section',{},h('h3',{},'Skills in this posting'),h('div',{class:'chips'},j.matched_skills.map(s=>h('span',{class:'chip good'},s)),j.missing_skills.map(s=>h('span',{class:'chip miss'},s)))):null,
      h('section',{},h('h3',{},'From the posting'),h('div',{class:'desc'},j.description||'The feed has no description. Open the posting to read it.'),
        h('p',{class:'sub origin'},'Listed on ',url?h('a',{href:url,target:'_blank',rel:'noopener'},SOURCE[j.source]||j.source):(SOURCE[j.source]||j.source)))));
  d.scrollTop=0}
function resetFilters(){for(const[k,v]of Object.entries(FILTER_DEFAULTS))$(k).value=v;$('q').value='';$('unv').checked=false;state.selected=null;load()}
let seq=0;
async function load(opt={}){const my=++seq;const scroll=$('list').scrollTop;
  if(!opt.keepScroll&&!state.jobs.length)$('list').replaceChildren(...Array.from({length:7},()=>h('li',{class:'skel'},h('i'),h('i'))));
  const p=new URLSearchParams({lane:state.lane,q:$('q').value,work_model:$('work').value,employment:$('employment').value,posted_within:$('posted').value,min_score:state.view==='new'?$('min').value:'0',sort:$('sort').value,status:state.view,limit:'200'});if($('unv').checked)p.set('unverified','1');
  try{const r=await fetch('/api/jobs?'+p);if(!r.ok)throw new Error(r.status);const data=await r.json();if(my!==seq)return;
    state.jobs=data.jobs;state.counts=data.counts;state.reactions=data.reactions;state.stages=data.stages||{};renderSegs();renderList();if(opt.keepScroll)$('list').scrollTop=scroll;
    const st=state.stages,tally=state.view==='applied'?` ${st.in_progress||0} in progress, ${st.rejected||0} rejected, ${st.hired||0} hired.`:'';
    $('line').textContent=`${data.total} ${data.total===1?'job':'jobs'}${data.total>data.jobs.length?`, showing the first ${data.jobs.length}`:''}.${tally} Updated ${ago(data.last_ingest)||'never'}.`;
  }catch{if(my!==seq)return;$('list').replaceChildren(h('li',{class:'empty'},h('strong',{},'Could not load jobs'),'Scout may have stopped. Run: uv run scout serve',h('div',{},h('button',{class:'btn',onclick(){load()}},'Try again'))));$('detail').replaceChildren()}}
$('searchIcon').append(svg('search'));
let t;$('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{state.selected=null;load()},220)});
for(const id of['work','employment','posted','min','sort','unv'])$(id).addEventListener('change',()=>{state.selected=null;load()});
$('reset').addEventListener('click',resetFilters);
$('toggle').addEventListener('click',()=>{const open=$('filters').classList.toggle('open');$('toggle').setAttribute('aria-expanded',String(open))});
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;const pick=toast.keys?.[Number(e.key)-1];if(pick){pick();return}if(e.key==='Escape'&&toast.hide){toast.hide();return}const j=current();if(e.key==='j')move(1);else if(e.key==='k')move(-1);else if(j&&e.key==='l')react(j,'like');else if(j&&e.key==='x')react(j,'dislike');else if(j&&e.key==='a')react(j,'applied');else if(j&&e.key==='o'){const u=safeUrl(j.url);if(u)window.open(u,'_blank','noopener')}});
load();
