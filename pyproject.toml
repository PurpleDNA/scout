[project]
name = "scout"
version = "0.1.0"
description = "Job finder for people in Nigeria: local on-site, hybrid and remote roles, global remote roles, trainee programmes and employers' own careers pages"
requires-python = ">=3.12"
dependencies = ["fastembed>=0.5", "numpy", "pypdf"]

[project.scripts]
scout = "scout.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout"]
