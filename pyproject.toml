[project]
name = "scout"
version = "0.1.0"
description = "Personal job recommender: global remote roles and Lagos hybrid/onsite roles"
requires-python = ">=3.12"
dependencies = ["fastembed>=0.5", "numpy", "pypdf"]

[project.scripts]
scout = "scout.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout"]
